<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" width="520" height="380">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#f3ede4"/>
    <stop offset="100%" stop-color="#f0f7f5"/>
  </linearGradient>
  <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#d9ebe4"/>
    <stop offset="100%" stop-color="#b3d3c7"/>
  </linearGradient>
</defs>

<rect x="0" y="0" width="520" height="380" fill="url(#sky)" rx="12"/>
<rect x="0" y="240" width="520" height="140" fill="url(#sea)"/>
<!-- horizon line emphasis -->
<line x1="0" y1="240" x2="520" y2="240" stroke="#d6cdbc" stroke-width="1.2" opacity="0.7"/>
<!-- distant mountains -->
<path d="M0 235 L60 220 L120 232 L200 215 L280 228 L350 218 L420 230 L520 222 L520 240 L0 240 Z" 
      fill="#b3d3c7" opacity="0.4"/>

<!-- board -->
<rect x="110" y="228" width="300" height="8" rx="4" fill="#9c8f78"/>
<rect x="110" y="228" width="300" height="2" rx="1" fill="#d6cdbc"/>

<!-- surfer standing - full body -->
<!-- back leg -->
<path d="M290 222 L290 270" stroke="#3b352c" stroke-width="6" stroke-linecap="round"/>
<!-- front leg -->
<path d="M325 222 L328 268" stroke="#3b352c" stroke-width="6" stroke-linecap="round"/>
<!-- bent knee indicators -->
<circle cx="290" cy="248" r="3" fill="#3e7a6b" opacity="0.6"/>
<circle cx="327" cy="246" r="3" fill="#3e7a6b" opacity="0.6"/>
<!-- torso (slightly leaning, weight centered) -->
<path d="M285 218 L335 218 L335 228 L285 228 Z" fill="#3b352c"/>
<!-- head -->
<circle cx="310" cy="210" r="8" fill="#3b352c"/>
<!-- hair/hat hint -->
<path d="M302 204 Q310 196 318 204" stroke="#6b6153" stroke-width="1.5" fill="none"/>

<!-- arms out for balance -->
<path d="M290 222 L240 218" stroke="#3b352c" stroke-width="3.5" stroke-linecap="round"/>
<path d="M330 222 L385 218" stroke="#3b352c" stroke-width="3.5" stroke-linecap="round"/>
<!-- hands loosely extended -->
<circle cx="238" cy="218" r="2.5" fill="#3b352c"/>
<circle cx="387" cy="218" r="2.5" fill="#3b352c"/>

<!-- eyes looking toward horizon (critical!) -->
<line x1="318" y1="208" x2="335" y2="206" stroke="#faf8f5" stroke-width="1.5"/>
<line x1="320" y1="212" x2="338" y2="211" stroke="#faf8f5" stroke-width="1"/>

<!-- annotation: knees bent -->
<line x1="290" y1="248" x2="260" y2="255" stroke="#3e7a6b" stroke-width="1" opacity="0.5"/>
<text x="248" y="258" font-family="DM Sans, system-ui, sans-serif" font-size="8" 
      fill="#3e7a6b" opacity="0.7">knees bent</text>

<!-- annotation: eyes forward -->
<line x1="335" y1="207" x2="370" y2="195" stroke="#3e7a6b" stroke-width="1" opacity="0.5"/>
<text x="372" y="197" font-family="DM Sans, system-ui, sans-serif" font-size="8" 
      fill="#3e7a6b" opacity="0.7">eyes up</text>

<!-- annotation: weight centered -->
<text x="310" y="290" text-anchor="middle" font-family="DM Sans, system-ui, sans-serif" 
      font-size="8" fill="#9c8f78" opacity="0.7">weight centered</text>

<text x="260" y="355" text-anchor="middle" font-family="DM Sans, system-ui, sans-serif" 
      font-size="13" fill="#6b6153" letter-spacing="0.12em" text-transform="uppercase">
  Stance &amp; Balance
</text>
</svg>