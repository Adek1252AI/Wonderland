<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" width="520" height="380">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#f3ede4"/>
    <stop offset="100%" stop-color="#f0f7f5"/>
  </linearGradient>
  <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#d9ebe4"/>
    <stop offset="100%" stop-color="#b3d3c7"/>
  </linearGradient>
</defs>

<rect x="0" y="0" width="520" height="380" fill="url(#sky)" rx="12"/>
<rect x="0" y="240" width="520" height="140" fill="url(#sea)"/>

<!-- LEFT: Duck Dive (shortboard) -->
<text x="130" y="28" text-anchor="middle" font-family="DM Sans, system-ui, sans-serif" 
      font-size="10" fill="#9c8f78" letter-spacing="0.1em" text-transform="uppercase">
  DUCK DIVE
</text>
<text x="130" y="42" text-anchor="middle" font-family="DM Sans, system-ui, sans-serif" 
      font-size="8" fill="#9c8f78" opacity="0.6">shortboard</text>

<!-- wave coming -->
<path d="M40 200 Q80 180 120 195 Q150 175 180 190 L180 240 L40 240 Z" 
      fill="#b3d3c7" opacity="0.6"/>
<path d="M40 200 Q80 180 120 195 Q150 175 180 190" 
      stroke="#7bb3a4" stroke-width="1.5" fill="none" opacity="0.7"/>

<!-- board diving under wave -->
<rect x="70" y="210" width="120" height="6" rx="3" fill="#9c8f78" transform="rotate(-20 130 213)"/>
<!-- surfer pushing nose down -->
<path d="M140 208 L120 220 L110 225" stroke="#3b352c" stroke-width="3" stroke-linecap="round" fill="none"/>
<!-- arm on nose -->
<circle cx="108" cy="225" r="3" fill="#3b352c"/>
<!-- body -->
<path d="M130 206 L145 210 L145 220 L130 220 Z" fill="#3b352c"/>
<!-- head -->
<circle cx="138" cy="204" r="5" fill="#3b352c"/>
<!-- arrow showing direction: diving under -->
<path d="M195 215 L215 215" stroke="#3e7a6b" stroke-width="1.2" marker-end="url(#arrR)"/>
<text x="225" y="218" font-family="DM Sans, system-ui, sans-serif" font-size="8" 
      fill="#3e7a6b" opacity="0.7">under wave</text>

<!-- divider -->
<line x1="260" y1="60" x2="260" y2="340" stroke="#e9dfce" stroke-width="0.8" opacity="0.5"/>

<!-- RIGHT: Turtle Roll (foam board) -->
<text x="390" y="28" text-anchor="middle" font-family="DM Sans, system-ui, sans-serif" 
      font-size="10" fill="#9c8f78" letter-spacing="0.1em" text-transform="uppercase">
  TURTLE ROLL
</text>
<text x="390" y="42" text-anchor="middle" font-family="DM Sans, system-ui, sans-serif" 
      font-size="8" fill="#9c8f78" opacity="0.6">long foam board</text>

<!-- wave coming -->
<path d="M310 200 Q350 180 390 195 Q420 175 450 190 L450 240 L310 240 Z" 
      fill="#b3d3c7" opacity="0.6"/>
<path d="M310 200 Q350 180 390 195 Q420 175 450 190" 
      stroke="#7bb3a4" stroke-width="1.5" fill="none" opacity="0.7"/>

<!-- board flipped upside down, surfer holding on underneath -->
<rect x="330" y="195" width="140" height="7" rx="3.5" fill="#9c8f78"/>
<!-- surfer hanging below board, holding rails -->
<path d="M350 202 L350 230" stroke="#3b352c" stroke-width="2.5" stroke-linecap="round"/>
<path d="M435 202 L435 228" stroke="#3b352c" stroke-width="2.5" stroke-linecap="round"/>
<!-- body hanging -->
<path d="M350 230 C355 240 370 245 400 245 C430 245 440 240 440 230" 
      stroke="#3b352c" stroke-width="3" fill="none" stroke-linecap="round"/>
<!-- head below -->
<circle cx="395" cy="250" r="5" fill="#3b352c"/>
<!-- hands gripping rails -->
<circle cx="350" cy="203" r="2.5" fill="#3b352c"/>
<circle cx="435" cy="203" r="2.5" fill="#3b352c"/>
<!-- arrow showing wave passing over -->
<path d="M460 195 L480 195" stroke="#3e7a6b" stroke-width="1.2" marker-end="url(#arrR)"/>
<text x="485" y="198" font-family="DM Sans, system-ui, sans-serif" font-size="8" 
      fill="#3e7a6b" opacity="0.7">wave passes</text>

<defs>
  <marker id="arrR" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto">
    <path d="M0 0 L5 2.5 L0 5 Z" fill="#3e7a6b" opacity="0.5"/>
  </marker>
</defs>

<text x="260" y="355" text-anchor="middle" font-family="DM Sans, system-ui, sans-serif" 
      font-size="13" fill="#6b6153" letter-spacing="0.12em" text-transform="uppercase">
  Duck Diving / Turtle Rolling
</text>
</svg>