<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" width="520" height="380">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#f3ede4"/>
    <stop offset="100%" stop-color="#f0f7f5"/>
  </linearGradient>
  <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#d9ebe4"/>
    <stop offset="100%" stop-color="#b3d3c7"/>
  </linearGradient>
</defs>

<rect x="0" y="0" width="520" height="380" fill="url(#sky)" rx="12"/>
<rect x="0" y="240" width="520" height="140" fill="url(#sea)"/>

<!-- beach foreground -->
<rect x="0" y="300" width="520" height="80" fill="#f3ede4"/>
<rect x="0" y="300" width="520" height="2" fill="#e9dfce"/>

<!-- waves coming in — multiple, showing different shapes -->
<!-- wave 1: good peak with shoulder -->
<path d="M80 240 Q90 210 100 200 Q110 195 120 210 Q130 225 140 240 Z" 
      fill="#d9ebe4" stroke="#7bb3a4" stroke-width="1"/>
<path d="M100 200 Q110 190 130 195" stroke="#3e7a6b" stroke-width="1" fill="none" opacity="0.6"/>
<!-- shoulder label line -->
<path d="M110 210 L140 210" stroke="#3e7a6b" stroke-width="0.8" stroke-dasharray="3 2" opacity="0.5"/>
<text x="145" y="208" font-family="DM Sans, system-ui, sans-serif" font-size="7" 
      fill="#3e7a6b" opacity="0.7">shoulder</text>

<!-- wave 2: closeout (flat top) -->
<path d="M220 240 Q230 215 245 210 Q260 215 270 240 Z" 
      fill="#d9ebe4" stroke="#7bb3a4" stroke-width="1"/>
<line x1="225" y1="215" x2="265" y2="215" stroke="#9c8f78" stroke-width="1" opacity="0.6"/>
<text x="245" y="208" text-anchor="middle" font-family="DM Sans, system-ui, sans-serif" 
      font-size="7" fill="#6b6153" opacity="0.6">closeout — skip</text>

<!-- wave 3: peak -->
<path d="M330 240 Q340 215 355 205 Q370 215 380 240 Z" 
      fill="#d9ebe4" stroke="#7bb3a4" stroke-width="1"/>
<path d="M350 205 L355 195" stroke="#14303a" stroke-width="1" opacity="0.5"/>
<text x="357" y="193" font-family="DM Sans, system-ui, sans-serif" font-size="7" 
      fill="#14303a" opacity="0.6">peak</text>

<!-- surfer on beach observing (small silhouette) -->
<circle cx="440" cy="295" r="5" fill="#3b352c"/>
<path d="M435 298 L435 310 L445 310 L445 298" fill="#3b352c"/>

<!-- observation arrows from surfer to waves -->
<path d="M445 300 L355 250" stroke="#9c8f78" stroke-width="0.8" stroke-dasharray="3 2" opacity="0.4"/>
<path d="M445 300 L245 250" stroke="#9c8f78" stroke-width="0.8" stroke-dasharray="3 2" opacity="0.4"/>
<path d="M445 300 L125 250" stroke="#9c8f78" stroke-width="0.8" stroke-dasharray="3 2" opacity="0.4"/>

<!-- "watch first" callout -->
<rect x="380" y="255" width="115" height="42" rx="6" fill="#f0f7f5" stroke="#d9ebe4" stroke-width="1"/>
<text x="437" y="270" text-anchor="middle" font-family="DM Sans, system-ui, sans-serif" 
      font-size="9" fill="#1f4a40" letter-spacing="0.08em">WATCH FIRST</text>
<text x="437" y="282" text-anchor="middle" font-family="DM Sans, system-ui, sans-serif" 
      font-size="7.5" fill="#3e7a6b">5 min from the beach</text>

<text x="260" y="355" text-anchor="middle" font-family="DM Sans, system-ui, sans-serif" 
      font-size="13" fill="#6b6153" letter-spacing="0.12em" text-transform="uppercase">
  Reading Waves &amp; Positioning
</text>
</svg>