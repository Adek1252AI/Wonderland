<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" width="520" height="380">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#f3ede4"/>
    <stop offset="100%" stop-color="#f0f7f5"/>
  </linearGradient>
  <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#d9ebe4"/>
    <stop offset="100%" stop-color="#b3d3c7"/>
  </linearGradient>
</defs>

<rect x="0" y="0" width="520" height="380" fill="url(#sky)" rx="12"/>
<rect x="0" y="240" width="520" height="140" fill="url(#sea)"/>
<path d="M0 265 Q80 258 160 265 T320 265 T480 265" 
      stroke="#7bb3a4" stroke-width="1" fill="none" opacity="0.4"/>

<!-- LEFT panel: lying down -->
<text x="130" y="30" text-anchor="middle" font-family="DM Sans, system-ui, sans-serif" 
      font-size="10" fill="#9c8f78" letter-spacing="0.1em" text-transform="uppercase">
  BEFORE
</text>
<rect x="55" y="215" width="150" height="7" rx="3.5" fill="#9c8f78"/>
<rect x="55" y="215" width="150" height="2" rx="1" fill="#d6cdbc/>
<!-- body prone -->
<path d="M80 210 C80 198 110 195 135 198 C150 200 175 204 190 207 L190 214 C175 212 155 209 140 207 C120 205 95 208 80 210 Z" 
      fill="#3b352c" opacity="0.8"/>
<circle cx="193" cy="205" r="6" fill="#3b352c"/>
<!-- hands on deck -->
<circle cx="100" cy="212" r="2.5" fill="#3b352c"/>
<circle cx="155" cy="210" r="2.5" fill="#3b352c"/>
<!-- small arrow showing transition -->
<path d="M210 218 L225 218" stroke="#3e7a6b" stroke-width="1.5" marker-end="url(#arrR)"/>

<!-- RIGHT panel: standing -->
<text x="390" y="30" text-anchor="middle" font-family="DM Sans, system-ui, sans-serif" 
      font-size="10" fill="#9c8f78" letter-spacing="0.1em" text-transform="uppercase">
  AFTER
</text>
<rect x="315" y="185" width="150" height="5" rx="2.5" fill="#9c8f78" opacity="0.5"/>
<!-- legs — standing stance, knees bent -->
<path d="M355 185 L355 230" stroke="#3b352c" stroke-width="5" stroke-linecap="round"/>
<path d="M385 185 L388 228" stroke="#3b352c" stroke-width="5" stroke-linecap="round"/>
<!-- knees bent indicator -->
<circle cx="355" cy="210" r="2.5" fill="#7bb3a4"/>
<circle cx="387" cy="208" r="2.5" fill="#7bb3a4"/>
<!-- torso -->
<path d="M350 185 L395 185 L395 195 L350 195 Z" fill="#3b352c" opacity="0.85"/>
<!-- head -->
<circle cx="372" cy="178" r="7" fill="#3b352c"/>
<!-- arms out for balance -->
<path d="M355 190 L325 195" stroke="#3b352c" stroke-width="3" stroke-linecap="round"/>
<path d="M390 190 L418 193" stroke="#3b352c" stroke-width="3" stroke-linecap="round"/>
<!-- eyes looking forward (horizon) -->
<line x1="378" y1="178" x2="388" y2="176" stroke="#faf8f5" stroke-width="1"/>

<!-- transition arrow between panels -->
<path d="M220 218 L300 218" stroke="#3e7a6b" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.6"/>
<text x="260" y="210" text-anchor="middle" font-family="DM Sans, system-ui, sans-serif" 
      font-size="9" fill="#3e7a6b" opacity="0.7">one motion</text>

<defs>
  <marker id="arrR" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto">
    <path d="M0 0 L5 2.5 L0 5 Z" fill="#3e7a6b" opacity="0.5"/>
  </marker>
</defs>

<text x="260" y="355" text-anchor="middle" font-family="DM Sans, system-ui, sans-serif" 
      font-size="13" fill="#6b6153" letter-spacing="0.12em" text-transform="uppercase">
  The Pop-Up
</text>
</svg>